name: Publish web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify API origin
        run: |
          node --input-type=module -e "
            import { API_ORIGIN } from './web/api-config.mjs';
            if (!API_ORIGIN) throw new Error('Set web/api-config.mjs API_ORIGIN before publishing');
            const url = new URL(API_ORIGIN);
            if (url.protocol !== 'https:' || API_ORIGIN !== url.origin) {
              throw new Error('Set web/api-config.mjs API_ORIGIN to the HTTPS API origin before publishing');
            }
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
